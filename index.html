<style>

    .product-body{padding:19px;display:flex;flex-direction:column;flex:1}.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:1.2px;color:#72baff;font-weight:800}
    .product h3{margin:9px 0;font-size:1.1rem;overflow-wrap:anywhere}
    .product-price{display:block;color:#55aaff;font-size:1.5rem;font-weight:900;margin:5px 0 10px}
    .product p{color:#aebed1;line-height:1.55;font-size:.92rem;flex:1;overflow-wrap:anywhere}

    .banner{border:1px solid #21456d;border-radius:18px;padding:28px;background:linear-gradient(115deg,#0e2d50,#0b1b30);display:flex;justify-content:space-between;align-items:center;gap:24px}

    footer{border-top:1px solid var(--line);padding:28px 0;color:#91a5bd;font-size:.85rem;line-height:1.7}
    .footrow{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}.hidden{display:none!important}
    #loadStatus{margin:0 0 18px;color:var(--muted);line-height:1.6}

    /* Redes sociais no topo com ícones reconhecíveis */
