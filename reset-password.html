
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha | JNHL Commerce</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #fff;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid #263a54;
      border-radius: 18px;
      background: #101e30;
    }
    h1 { margin-top: 0; font-size: 26px; }
    p { color: #c5d2e3; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #526780;
      border-radius: 9px;
      background: #07111f;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #1687ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { margin-top: 16px; overflow-wrap: anywhere; }
    a { color: #7fbcff; }
  </style>
</head>
<body>
  <main>
    <h1>Redefinir senha</h1>
    <p>Crie uma nova senha para acessar o painel administrativo da JNHL Commerce.</p>

    <form id="form">
      <label for="password">Nova senha</label>
      <input id="password" type="password" minlength="8"
        autocomplete="new-password" required
        placeholder="Mínimo de 8 caracteres">

      <label for="confirm">Confirme a nova senha</label>
      <input id="confirm" type="password" minlength="8"
        autocomplete="new-password" required
        placeholder="Digite a senha novamente">

      <button id="submit" type="submit">Salvar nova senha</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="./admin/index.html">Voltar ao painel administrativo</a></p>
  </main>

  <script>
    const SUPABASE_URL = "https://irtqenyuevxfuenuqcqq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rVnd_c4Pb7ZBSsAY3xX9WQ_EieuPSeR";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");
    const form = document.getElementById("form");
    const submit = document.getElementById("submit");

    let recoveryReady = false;

    function show(text, ok = false) {
      message.textContent = text;
      message.style.color = ok ? "#72f0ae" : "#ffb4b4";
    }

    async function initialize() {
      const params = new URLSearchParams(location.search);
      const hash = new URLSearchParams(location.hash.slice(1));
      const code = params.get("code");
      const error = hash.get("error_description") ||
                    params.get("error_description");

      if (error) {
        show("O link de recuperação não é válido ou expirou. Solicite outro e-mail.");
        return;
      }

      if (code) {
        const { error } =
          await supabaseClient.auth.exchangeCodeForSession(code);

        if (error) {
          show("Não foi possível validar o link: " + error.message);
          return;
        }

        history.replaceState(null, "", location.pathname);
        recoveryReady = true;
      } else {
        const { data } = await supabaseClient.auth.getSession();

        if (data.session) {
          recoveryReady = true;
        } else {
          show("Abra esta página pelo link mais recente enviado pelo Supabase.");
          return;
        }
      }

      show("Link validado. Digite sua nova senha.", true);
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryReady = true;
        show("Link validado. Digite sua nova senha.", true);
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password.length < 8) {
        show("A senha deve ter pelo menos 8 caracteres.");
        return;
      }

      if (password !== confirm) {
        show("As senhas não são iguais.");
        return;
      }

      if (!recoveryReady) {
        show("O link ainda não foi validado. Solicite um novo e-mail.");
        return;
      }

      submit.disabled = true;
      show("Salvando nova senha...", true);

      const { error } = await supabaseClient.auth.updateUser({
        password: password
      });

      submit.disabled = false;

      if (error) {
        show("Não foi possível atualizar a senha: " + error.message);
        return;
      }

      await supabaseClient.auth.signOut();
      form.reset();
      show("Senha alterada com sucesso! Agora entre no painel com a nova senha.", true);
    });

    initialize().catch((error) => {
      show("Erro ao validar o link: " + error.message);
    });
  </script>
</body>
</html>
